name: Test Poetry installer-parallel configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: install
        name: Install Poetry with installer-parallel disabled
        uses: .
        with:
          version: latest
          installer-parallel: "false"

      - name: Assert poetry is on PATH
        run: |
          if ! command -v poetry &>/dev/null; then
            echo "FAIL: poetry not found on PATH"
            exit 1
          fi
          echo "PASS: poetry found at $(command -v poetry)"

      - name: Assert installer.parallel is false
        run: |
          CONFIG="$(poetry config installer.parallel)"
          echo "installer.parallel: $CONFIG"
          if [ "$CONFIG" != "false" ]; then
            echo "FAIL: expected installer.parallel=false, got '$CONFIG'"
            exit 1
          fi
          echo "PASS"
