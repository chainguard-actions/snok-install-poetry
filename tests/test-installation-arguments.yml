name: Test installation-arguments input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          installation-arguments: --force
      - name: Assert Poetry is installed
        run: |
          if ! command -v poetry &> /dev/null; then
            echo "FAIL: poetry command not found after installation with --force argument"
            exit 1
          fi
          echo "PASS: poetry is installed"
          poetry --version
