name: Test installation-arguments input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          installation-arguments: --force
      - name: Assert Poetry is installed
        run: |
          echo "Checking Poetry installation with --force argument..."
          if ! command -v poetry &> /dev/null; then
            echo "FAIL: poetry command not found"
            exit 1
          fi
          POETRY_VERSION=$(poetry --version)
          echo "actual: $POETRY_VERSION"
          echo "PASS: Poetry installed successfully with installation-arguments=--force"
