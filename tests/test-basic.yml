name: Test basic Poetry installation (latest)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-poetry
        name: Install Poetry (latest)
        uses: .
        with:
          version: latest
      - name: Assert poetry is on PATH
        run: |
          which poetry
          if ! which poetry; then
            echo "FAIL: poetry not found on PATH"
            exit 1
          fi
          echo "PASS: poetry found on PATH"
      - name: Assert poetry version command works
        run: |
          POETRY_VERSION="$(poetry --version)"
          echo "actual: $POETRY_VERSION"
          if [ -z "$POETRY_VERSION" ]; then
            echo "FAIL: poetry --version returned empty"
            exit 1
          fi
          echo "PASS: poetry version: $POETRY_VERSION"
      - name: Assert default virtualenvs.create is true
        run: |
          CONFIG="$(poetry config virtualenvs.create)"
          echo "actual virtualenvs.create: $CONFIG"
          if [ "$CONFIG" != "true" ]; then
            echo "FAIL: expected virtualenvs.create=true, got: $CONFIG"
            exit 1
          fi
          echo "PASS"
      - name: Assert default virtualenvs.in-project is false
        run: |
          CONFIG="$(poetry config virtualenvs.in-project)"
          echo "actual virtualenvs.in-project: $CONFIG"
          if [ "$CONFIG" != "false" ]; then
            echo "FAIL: expected virtualenvs.in-project=false, got: $CONFIG"
            exit 1
          fi
          echo "PASS"
