name: Test virtualenvs-create=false configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          virtualenvs-create: "false"
      - name: Assert Poetry is installed
        run: |
          if ! command -v poetry &>/dev/null; then
            echo "FAIL: poetry command not found in PATH"
            exit 1
          fi
          echo "PASS: poetry found"
      - name: Assert virtualenvs.create is set to false
        run: |
          CONFIG="$(poetry config virtualenvs.create)"
          echo "virtualenvs.create: $CONFIG"
          if [ "$CONFIG" != "false" ]; then
            echo "FAIL: expected virtualenvs.create=false, got $CONFIG"
            exit 1
          fi
          echo "PASS"
