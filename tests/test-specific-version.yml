name: Test specific Poetry version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: install-poetry
        name: Install Poetry (specific version)
        uses: .
        with:
          version: "1.8.0"

      - name: Assert Poetry is installed with the correct version
        run: |
          echo "Checking poetry binary..."
          if ! command -v poetry &>/dev/null; then
            echo "FAIL: poetry not found on PATH"
            exit 1
          fi
          POETRY_VERSION="$(poetry --version)"
          echo "poetry version output: $POETRY_VERSION"
          if echo "$POETRY_VERSION" | grep -q "1.8.0"; then
            echo "PASS: correct version installed"
          else
            echo "FAIL: expected version 1.8.0, got: $POETRY_VERSION"
            exit 1
          fi
